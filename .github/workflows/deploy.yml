name: Deploy docs

# Triggers on push to main and on manual run from the Actions tab.
# The build step does not need any secrets — it's a static site
# generator. The deploy step rsyncs `dist/` to docs.pezeshkpour.eu
# over SSH using a deploy key stored in repo secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Deploy via rsync over SSH. Mirrors the existing pattern used
      # by the pezeshkpour.eu main site. The runner needs:
      #   - DEPLOY_SSH_KEY  : private key (ed25519 recommended)
      #   - DEPLOY_HOST     : e.g. pezeshkpour.eu
      #   - DEPLOY_USER     : ssh user with write access to the docs root
      #   - DEPLOY_PATH     : absolute target path, e.g.
      #                       /var/www/docs.pezeshkpour.eu/
      - name: Setup SSH
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        if: github.event_name == 'push'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"
